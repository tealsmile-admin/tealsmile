<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-label="Digital marketing, automation and software growth illustration">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00897B"/>
      <stop offset="100%" stop-color="#4DB6AC"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0F2F1"/>
      <stop offset="100%" stop-color="#B2DFDB"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00897B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ambient shapes -->
  <circle cx="520" cy="90" r="70" fill="#E0F2F1" opacity="0.7"/>
  <circle cx="80" cy="420" r="50" fill="#B2DFDB" opacity="0.35"/>
  <circle cx="580" cy="380" r="36" fill="#4DB6AC" opacity="0.15"/>

  <!-- main panel -->
  <rect x="90" y="70" width="420" height="300" rx="24" fill="#fff" stroke="#EAEAEA" filter="url(#soft)"/>
  <rect x="90" y="70" width="420" height="52" rx="24" fill="url(#g1)"/>
  <rect x="90" y="98" width="420" height="24" fill="url(#g1)"/>
  <circle cx="118" cy="96" r="6" fill="#fff" opacity="0.85"/>
  <circle cx="138" cy="96" r="6" fill="#fff" opacity="0.55"/>
  <circle cx="158" cy="96" r="6" fill="#fff" opacity="0.35"/>

  <!-- chart bars -->
  <rect x="130" y="250" width="36" height="80" rx="8" fill="#B2DFDB"/>
  <rect x="180" y="210" width="36" height="120" rx="8" fill="#80CBC4"/>
  <rect x="230" y="180" width="36" height="150" rx="8" fill="#4DB6AC"/>
  <rect x="280" y="150" width="36" height="180" rx="8" fill="#00897B"/>

  <!-- line chart -->
  <path d="M340 300 C370 280, 390 250, 420 220 C445 195, 465 185, 490 160" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="490" cy="160" r="8" fill="#00897B"/>
  <circle cx="490" cy="160" r="14" fill="#00897B" opacity="0.2"/>

  <!-- floating cards -->
  <g filter="url(#soft)">
    <rect x="430" y="300" width="150" height="90" rx="16" fill="#fff" stroke="#EAEAEA"/>
    <circle cx="462" cy="338" r="18" fill="url(#g2)"/>
    <path d="M454 338h16M462 330v16" stroke="#00897B" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="492" y="326" width="70" height="8" rx="4" fill="#E0F2F1"/>
    <rect x="492" y="344" width="52" height="8" rx="4" fill="#B2DFDB"/>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="160" width="140" height="78" rx="16" fill="#fff" stroke="#EAEAEA"/>
    <rect x="58" y="182" width="28" height="28" rx="8" fill="url(#g1)"/>
    <path d="M66 196l5 5 10-12" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="98" y="186" width="64" height="7" rx="3.5" fill="#E0F2F1"/>
    <rect x="98" y="202" width="46" height="7" rx="3.5" fill="#B2DFDB"/>
  </g>

  <!-- cloud node -->
  <g filter="url(#soft)">
    <rect x="200" y="400" width="200" height="70" rx="18" fill="#fff" stroke="#EAEAEA"/>
    <path d="M240 440c0-14 10-24 24-24 3-12 14-20 27-20 16 0 29 12 30 28h4c12 0 22 9 22 20s-10 20-22 20H250c-14 0-26-11-26-24z" fill="url(#g2)"/>
    <circle cx="360" cy="435" r="10" fill="#00897B"/>
    <path d="M356 435h8M360 431v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
